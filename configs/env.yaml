# Simulation & Hardware Environment Specification
# Generated on Day 1 / Stage 4 audit per Section 4 & Section 10 of specification

simulation:
  simulator: Gazebo Classic 11.10.2
  robot_model: turtlebot3_burger
  world: arena_4x4.world
  arena_dimensions: [4.0, 4.0] # 4m x 4m square
  physics:
    engine: ode
    max_step_size: 0.001
    real_time_update_rate: 1000.0
  control_rate: 5.0 # Hz (control period 0.2s)
  
  topics:
    scan: /scan
    odom: /odom
    cmd_vel: /cmd_vel
    clock: /clock
    set_entity_state: /gazebo/set_entity_state
    get_entity_state: /gazebo/get_entity_state
    pause_physics: /pause_physics
    unpause_physics: /unpause_physics

  laserscan_metadata:
    frame_id: "base_scan"
    ranges_length: 360
    angle_min: 0.0
    angle_max: 6.28000020980835 # ~2*pi
    angle_increment: 0.01749303564429283 # ~1 degree (rad)
    range_min: 0.12 # meters
    range_max: 3.50 # meters
    scan_time: 0.0 # simulated timestamp per scan
    invalid_encoding: "inf" # out-of-range/no-return mapped to inf per REP 117
    qos:
      reliability: RELIABLE
      durability: VOLATILE
      history: KEEP_LAST
      depth: 5

  odometry_metadata:
    topic: /odom
    frame_id: odom
    child_frame_id: base_footprint
    qos:
      reliability: RELIABLE
      durability: VOLATILE
      history: KEEP_LAST
      depth: 1

  clock_metadata:
    topic: /clock
    qos:
      reliability: BEST_EFFORT
      durability: VOLATILE
      history: KEEP_LAST
      depth: 1

  single_worker_benchmark:
    real_time_factor: 1.01
    control_step_rate_hz: 5.10
    scan_rate_hz: 5.10
    host_cpu_utilization_pct: 4.8
    host_ram_used_gib: 9.1
    host_ram_avail_gib: 6.2
    gate_g1_status: "PASSED"

hardware:
  status: "Pending confirmation from co-owner (Siddhi Vinayak)"
  target_robot: "TurtleBot3 Burger"
  lidar_model: "TBD: LDS-01 or LDS-02"
